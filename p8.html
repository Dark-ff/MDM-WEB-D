
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">

        <h2 class="text-2xl font-bold mb-5 text-center">
            Student Registration
        </h2>

        <form id="registrationForm">

            <!-- Name -->
            <label>Student Name</label>
            <input type="text" id="name"
                class="w-full border p-2 mb-3 rounded">

            <!-- Email -->
            <label>Email</label>
            <input type="text" id="email"
                class="w-full border p-2 mb-3 rounded">

            <!-- Password -->
            <label>Password</label>
            <div class="relative mb-4">
                <input type="password" id="password"
                    class="w-full border p-2 mb-3 rounded">

                <button type="button" id="showPassword"
                    class="absolute right-2 top-2 text-green-500 text-sm">
                    Show Password
                </button>
            </div>

            <!-- Mobile -->
            <label>Mobile Number</label>
            <input type="text" id="mobile"
                class="w-full border p-2 mb-4 rounded">

            <button type="submit"
                class="w-full bg-blue-500 text-white p-2 rounded">
                Register
            </button>

            <p id="message" class="mt-4 text-center"></p>

        </form>
    </div>

    <script>

        // Show / Hide Password
        document.getElementById("showPassword").onclick = function() {

            let password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
                this.innerHTML = "Hide Password";
            } else {
                password.type = "password";
                this.innerHTML = "Show Password";
            }

        };

        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");

            // Mandatory fields
            if (name == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
            let upper = /[A-Z]/;
            let lower = /[a-z]/;
            let number = /[0-9]/;
            let symbol = /[^A-Za-z0-9]/;

            if (
                password.length < 8 ||
                !upper.test(password) ||
                !lower.test(password) ||
                !number.test(password) ||
                !symbol.test(password)
            ) {
                message.innerHTML = "Password must contain 8 characters, uppercase, lowercase, number and special symbol.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";

        };

    </script>

</body>
</html>
